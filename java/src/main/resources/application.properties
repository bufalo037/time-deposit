spring.application.name=time-deposit-kata

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates the mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# OpenAPI (springdoc, ADR 0006): sorted keys keep the generated spec stable for the committed openapi.yaml contract.
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.path=/swagger-ui.html
